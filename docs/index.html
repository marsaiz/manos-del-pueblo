<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manos del Pueblo - Artesanías y productos locales de artesanos argentinos. Conectamos artesanos con el mundo.">

  <!-- Accesibilidad: tema de color para navegadores -->
  <meta name="theme-color" content="#5D4037">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manos del Pueblo">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>Manos del Pueblo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Evita el flash de fondo blanco al cargar */
    body {
      background-color: #F5F5DC;
      margin: 0;
      padding: 0;
    }

    /* Indicador de foco visible para navegación por teclado (WCAG 2.4.7) */
    :focus-visible {
      outline: 3px solid #5D4037;
      outline-offset: 2px;
    }

    /* Oculta el outline por defecto solo cuando se usa mouse */
    :focus:not(:focus-visible) {
      outline: none;
    }
  </style>
</head>
<body>
  <!-- Texto para lectores de pantalla mientras carga la app -->
  <noscript>
    <p>Manos del Pueblo requiere JavaScript para funcionar. Por favor habilitá JavaScript en tu navegador.</p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
